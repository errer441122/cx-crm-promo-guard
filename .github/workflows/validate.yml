name: Validate Workflows & Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both n8n workflow blueprints and documentation exist
        run: |
          python3 -c "import json; w1=json.load(open('workflows/cx-promo-guard.n8n.json')); w2=json.load(open('workflows/cx-hold-release.n8n.json')); assert len(w1['nodes'])==10 and len(w2['nodes'])==6"
          test -f prompts/cx-triage-and-draft-prompt.md
          test -f docs/state-machine-and-crm-rules.md
          test -f docs/sop-cx-crm-operations.md
          test -f templates/klaviyo-global-exclusion-template.csv
          test -f templates/hubspot-suppression-template.csv
